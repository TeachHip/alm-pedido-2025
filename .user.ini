; Production hardening: this host's default has display_errors ON, meaning
; any uncaught PHP error/warning would show file paths and other internals
; directly to visitors, not just in logs. LiteSpeed/CloudLinux hosts honor
; per-directory .user.ini (PHP_INI_PERDIR scope) without needing php.ini/root
; access, and it applies recursively to subdirectories (admin/ included).
; No effect locally against php -S / a php.ini that already has this off.
display_errors = Off
display_startup_errors = Off
